name: Build Clash Party override

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - build.py
      - override.template.js
      - verify.mjs
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: clash-party-override
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIHOMO_VERSION: v1.19.32
      MIHOMO_SHA256: 306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the override
        run: python3 build.py
      - name: Cache Mihomo validation archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mihomo.gz
          key: mihomo-${{ runner.os }}-${{ runner.arch }}-${{ env.MIHOMO_SHA256 }}
      - name: Validate with Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/mihomo"
          archive="$core.gz"
          asset="mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz"
          verify_archive() {
            printf '%s  %s\n' "$MIHOMO_SHA256" "$archive" | sha256sum "$@" -c -
          }
          if [[ ! -f "$archive" ]] || ! verify_archive --status; then
            if ! curl -fsSL --connect-timeout 10 --max-time 45 \
                "https://github.com/MetaCubeX/mihomo/releases/download/$MIHOMO_VERSION/$asset" \
                -o "$archive" || ! verify_archive --status; then
              echo 'Trying the GitHub release API for the Mihomo archive'
              timeout 90s gh release download "$MIHOMO_VERSION" \
                --repo MetaCubeX/mihomo --pattern "$asset" --output "$archive" --clobber
            fi
          fi
          verify_archive
          gzip -dc "$archive" > "$core"
          chmod +x "$core"
          node verify.mjs "$core"
      - name: Publish changed output
        run: |
          set -euo pipefail
          git add -- dist/AkiraNyx-Clash-Party.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh Clash Party rules'
          git push
