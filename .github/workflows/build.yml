name: Build Clash Party override

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - build.py
      - override.template.js
      - verify.mjs
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: clash-party-override
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate the override
        run: python3 build.py
      - name: Validate with Mihomo
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/mihomo"
          curl -fsSL --retry 3 --max-time 120 \
            'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1-v1.19.32.gz' \
            -o "$core.gz"
          echo "306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc  $core.gz" | sha256sum -c -
          gzip -dc "$core.gz" > "$core"
          chmod +x "$core"
          node verify.mjs "$core"
      - name: Publish changed output
        run: |
          set -euo pipefail
          git add -- dist/AkiraNyx-Clash-Party.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh Clash Party rules'
          git push
